name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Unit Tests (with Race Detector)
        run: go test -v -race -cover ./...

      - name: Build Binary
        run: go build -v -o bin/capacitylab cmd/capacitylab/main.go

      - name: CLI Smoke Test
        run: |
          ./bin/capacitylab --help
          ./bin/capacitylab init --help
          ./bin/capacitylab validate --help
          ./bin/capacitylab report --help
          ./bin/capacitylab dashboard --help
