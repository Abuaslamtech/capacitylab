version: "1"

# Target Application Definition (supports ${VAR:-default} and .env auto-loading)
application:
  name: ${APP_NAME:-example-service}
  url: ${API_URL:-http://localhost:3000}
  startup:
    compose_file: ./docker-compose.yml
    wait_for_health: true
    timeout: 60s

# Controlled Service Resource Matrix
services:
  api:
    container: ${API_CONTAINER:-example-api}
    cpu: "1.0"
    memory: "1GB"
    cpuset: "0,1"
    test_matrix:
      cpu: ["0.5", "1.0", "2.0"]
      memory: ["512MB", "1GB", "2GB"]

  postgres:
    container: ${PG_CONTAINER:-example-postgres}
    dsn: ${POSTGRES_DSN:-postgres://postgres:postgres@localhost:5432/app_db?sslmode=disable}
    max_connections: 100

  redis:
    container: ${REDIS_CONTAINER:-example-redis}
    addr: ${REDIS_ADDR:-localhost:6379}

# Workload Generation Parameters
workload:
  type: step-ramp
  engine: native # "native" (default connection-pooled Go runner) or "k6"
  start_users: 10
  max_users: 1000
  step: 50
  step_duration: 30s
  warmup_duration: 15s
  pacing:
    think_time_min: 200ms
    think_time_max: 800ms

# Saturation Breaking Criteria (SLAs)
thresholds:
  max_cpu_percent: 85
  max_memory_percent: 80
  max_p95_latency_ms: 250
  max_error_rate_percent: 1.0
  max_cpu_throttle_percent: 15

# Realistic Weighted User Journeys (supports dynamic generators: {{$uuid}}, {{$timestamp}}, {{$random_int(min,max)}})
scenarios:
  - name: browse_catalog
    weight: 40
    flow:
      - get: /api/v1/health
      - get: /api/v1/products?limit=20
      - get: /api/v1/categories

  - name: checkout_order
    weight: 40
    flow:
      - post:
          path: /api/v1/cart
          headers:
            X-Request-ID: "{{$uuid}}"
          body:
            product_id: "prod-{{$random_int(100,105)}}"
            quantity: 1
      - post:
          path: /api/v1/checkout
          headers:
            X-Request-ID: "{{$uuid}}"
            Authorization: "Bearer ${AUTH_TOKEN:-dev-token}"
          body:
            order_id: "{{$uuid}}"
            payment_method: "credit_card"
            timestamp: "{{$timestamp}}"

  - name: user_account_sync
    weight: 20
    flow:
      - get: /api/v1/profile
      - get: /api/v1/orders/recent
