# CapacityLab Configuration
version: "1"

# 1. Target Application Definition
application:
  name: my-backend
  url: http://127.0.0.1:3000
  startup:
    compose_file: ./docker-compose.yml
    wait_for_health: true
    timeout: 60s

# 2. Services to profile under controlled resource limits
services:
  api:
    container: my-api-container
    test_matrix:
      cpu: ["0.5", "1.0"]
      memory: ["256MB", "512MB"]

  postgres:
    container: my-postgres-container
    dsn: ""
    max_connections: 100

  redis:
    container: my-redis-container
    addr: ""

# 3. Workload Step Ramping
workload:
  type: step-ramp
  start_users: 10
  max_users: 1000
  step: 50
  step_duration: 30s
  warmup_duration: 15s
  pacing:
    think_time_min: 200ms
    think_time_max: 800ms

# 4. Saturation & SLA Thresholds
thresholds:
  max_cpu_percent: 85
  max_memory_percent: 80
  max_p95_latency_ms: 250
  max_error_rate_percent: 1.0

# 5. Realistic User Journeys
scenarios:
  - name: browse_dashboard
    weight: 50
    flow:
      - get: /api/v1/health
      - get: /api/v1/dashboard

  - name: create_record
    weight: 50
    flow:
      - post:
          path: /api/v1/records
          body:
            name: "test-item"
